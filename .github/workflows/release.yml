name: Release

# Fires on any `v*` tag push. Builds Windows, Linux, and macOS in parallel and
# drops the installers into a published GitHub Release named after the tag.
# macOS bundles are ad-hoc signed until Developer ID signing is configured.
on:
  push:
    tags:
      - "v*"

# Guard against two runs stepping on each other if a tag is force-pushed.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: ubuntu-22.04
            label: Linux
            bundles: appimage,deb
          - platform: windows-latest
            label: Windows
            bundles: nsis
          - platform: macos-latest
            label: macOS (Apple Silicon)
            bundles: dmg
          - platform: macos-15-intel
            label: macOS (Intel)
            bundles: dmg

    name: Build ${{ matrix.label }}
    runs-on: ${{ matrix.platform }}

    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: client/package-lock.json

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust target
        uses: swatinem/rust-cache@v2
        with:
          workspaces: client/src-tauri -> target

      - name: Install Linux build deps
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libjavascriptcoregtk-4.1-dev \
            libsoup-3.0-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf \
            build-essential \
            curl \
            wget \
            file \
            libxdo-dev

      - name: Install client dependencies
        working-directory: ./client
        run: npm ci

      - name: Require updater signing secrets
        shell: bash
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          if [[ -z "$TAURI_SIGNING_PRIVATE_KEY" || -z "$TAURI_SIGNING_PRIVATE_KEY_PASSWORD" ]]; then
            echo "Updater signing secrets are required for release builds."
            exit 1
          fi

      - name: Build Tauri bundles
        uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Tauri updater signatures are independent of paid OS trust
          # certificates and are mandatory for update installation.
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          projectPath: ./client
          tauriScript: npx tauri
          args: --bundles ${{ matrix.bundles }}
          tagName: ${{ github.ref_name }}
          releaseName: "Inkwell ${{ github.ref_name }}"
          releaseBody: |
            ## Inkwell ${{ github.ref_name }}

            Download the installer for your platform below.

            - **Windows:** `.exe` (NSIS installer). Windows SmartScreen will
              show a warning on first run — click "More info" → "Run anyway".
              Releases are unsigned for now; we'll add code signing before
              public launch.
            - **Linux:** `.AppImage` (portable, works on most distros) or
              `.deb` (for Debian/Ubuntu).
            - **macOS:** `.dmg` for Apple Silicon or Intel. These builds are
              ad-hoc signed and not notarized yet, so on first launch use
              Control-click → Open and confirm the Gatekeeper prompt.

            ### Notes
            - Windows and Linux desktop builds can check for signed updates
              manually in Settings → About & Legal. macOS updates remain
              manual until Developer ID signing and notarization are enabled.
            - First launch creates a local SQLite database at
              `~/.config/com.inkwell.app/inkwell.db` (Linux) or
              `%APPDATA%\com.inkwell.app\inkwell.db` (Windows). All your
              projects stay on your machine — no server required.
            - macOS uses `~/Library/Application Support/com.inkwell.app/inkwell.db`.
          # Published, not held as a draft. Every tag so far built cleanly and
          # then sat unpublished, so the repo showed six tags and no releases —
          # the artefacts existed but nobody could reach them.
          releaseDraft: false
          prerelease: false
