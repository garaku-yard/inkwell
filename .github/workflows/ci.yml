name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Cancel any stale runs for the same ref as soon as a new one starts.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  server:
    name: Server — build, vet, test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./server
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-go@v6
        with:
          go-version: "1.24"
          cache: true
          cache-dependency-path: server/go.sum

      - name: Download modules
        run: go mod download

      - name: Format check
        run: test -z "$(gofmt -l .)" || { echo 'gofmt found unformatted files:'; gofmt -l .; exit 1; }

      - name: Build
        run: go build ./...

      - name: Vet
        run: go vet ./...

      - name: Test
        run: go test -race -count=1 ./...

  client:
    name: Client — typecheck, lint, test, build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./client
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: client/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Lint
        run: npm run lint

      # The suite gates more than component smoke: it holds the contracts
      # TypeScript can't check — the Tauri fs capability manifest and the
      # client/server category list. Both are plain JSON, so without this step a
      # broken contract compiles, lints, builds, and ships.
      - name: Test
        run: npm test

      - name: Build
        env:
          # Build-time only; the real gateway URL is injected at runtime.
          NEXT_PUBLIC_API_URL: http://localhost:8080
        run: npm run build
