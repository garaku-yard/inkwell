syntax = "proto3";

package identity;

option go_package = "inkwell/server/pkg/grpc/identity";

import "common/types.proto";

// User entity
message User {
  string id = 1;
  string email = 2;
  string username = 3;
  string user_tag = 4;
  string first_name = 5;
  string last_name = 6;
  string avatar_url = 7;
  common.Timestamp created_at = 8;
  common.Timestamp updated_at = 9;
  bool is_active = 10;
  string role = 11; // "admin", "user", "premium"
  bool totp_enabled = 12; // two-factor enabled
}

// Authentication requests/responses
message RegisterRequest {
  string email = 1;
  string username = 2;
  string password = 3;
  string first_name = 4;
  string last_name = 5;
}

message RegisterResponse {
  User user = 1;
  string access_token = 2;
  string refresh_token = 3;
  string session_id = 4;
}

message LoginRequest {
  string email = 1;
  string password = 2;
  string totp_code = 3; // second factor; empty on the first step
}

message LoginResponse {
  User user = 1;
  string access_token = 2;
  string refresh_token = 3;
  string session_id = 4;
  bool totp_required = 5; // password OK but 2FA code needed; tokens are empty
}

message RefreshTokenRequest {
  string refresh_token = 1;
}

message RefreshTokenResponse {
  string access_token = 1;
  string refresh_token = 2;
}

message ValidateTokenRequest {
  string access_token = 1;
}

message ValidateTokenResponse {
  bool valid = 1;
  User user = 2;
  common.Timestamp expires_at = 3;
}

// User management requests/responses
message GetUserRequest {
  string user_id = 1;
}

message GetUserByUsernameTagRequest {
  string username = 1;
  string user_tag = 2;
}

message GetUserResponse {
  User user = 1;
}

message UpdateUserRequest {
  string user_id = 1;
  optional string email = 2;
  optional string username = 3;
  optional string first_name = 4;
  optional string last_name = 5;
  optional string avatar_url = 6;
}

message UpdateUserResponse {
  User user = 1;
}

message GetUsersRequest {
  repeated string user_ids = 1;
  common.PaginationRequest pagination = 2;
}

message GetUsersResponse {
  repeated User users = 1;
  common.PaginationResponse pagination = 2;
}

message ChangePasswordRequest {
  string user_id = 1;
  string current_password = 2;
  string new_password = 3;
}

message ChangePasswordResponse {
  bool success = 1;
}

// Active session (a row in user_sessions) surfaced to the user for the
// Security → Active Sessions UI.
message Session {
  string session_id = 1;
  common.Timestamp created_at = 2;
  common.Timestamp expires_at = 3;
  common.Timestamp last_used_at = 4;
  string device_info = 5;   // user-agent captured at login
  string ip_address = 6;    // client IP captured at login
  bool is_current = 7;      // matches the requesting device's session
}

message ListSessionsRequest {
  string user_id = 1;
  // The caller's current session id (from the gateway's sid cookie), used to
  // flag is_current. Empty when the caller can't be identified.
  string current_session_id = 2;
}

message ListSessionsResponse {
  repeated Session sessions = 1;
}

message RevokeSessionRequest {
  string user_id = 1;     // owner check — a user may only revoke their own
  string session_id = 2;
}

message RevokeSessionResponse {
  bool success = 1;
}

// Two-factor (TOTP)
message EnrollTOTPRequest {
  string user_id = 1;
}

message EnrollTOTPResponse {
  string secret = 1;        // base32, for manual entry
  string otpauth_uri = 2;   // otpauth:// URI
  bytes qr_png = 3;         // pre-rendered QR image
}

message ConfirmTOTPRequest {
  string user_id = 1;
  string code = 2;
}

message ConfirmTOTPResponse {
  repeated string recovery_codes = 1; // shown to the user exactly once
}

message DisableTOTPRequest {
  string user_id = 1;
  string code = 2; // current TOTP or recovery code
}

message DisableTOTPResponse {
  bool success = 1;
}

// Identity service definition
service IdentityService {
  // Authentication
  rpc Register(RegisterRequest) returns (RegisterResponse);
  rpc Login(LoginRequest) returns (LoginResponse);
  rpc RefreshToken(RefreshTokenRequest) returns (RefreshTokenResponse);
  rpc ValidateToken(ValidateTokenRequest) returns (ValidateTokenResponse);
  
  // User management
  rpc GetUser(GetUserRequest) returns (GetUserResponse);
  rpc GetUserByUsernameTag(GetUserByUsernameTagRequest) returns (GetUserResponse);
  rpc GetUsers(GetUsersRequest) returns (GetUsersResponse);
  rpc UpdateUser(UpdateUserRequest) returns (UpdateUserResponse);
  rpc ChangePassword(ChangePasswordRequest) returns (ChangePasswordResponse);

  // Session management (Security settings)
  rpc ListSessions(ListSessionsRequest) returns (ListSessionsResponse);
  rpc RevokeSession(RevokeSessionRequest) returns (RevokeSessionResponse);

  // Two-factor (TOTP)
  rpc EnrollTOTP(EnrollTOTPRequest) returns (EnrollTOTPResponse);
  rpc ConfirmTOTP(ConfirmTOTPRequest) returns (ConfirmTOTPResponse);
  rpc DisableTOTP(DisableTOTPRequest) returns (DisableTOTPResponse);
}