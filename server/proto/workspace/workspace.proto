syntax = "proto3";

package workspace;

option go_package = "inkwell/server/pkg/grpc/workspace";

import "common/types.proto";

// ─── Entities ────────────────────────────────────────────────────────────────

message Category {
  string id   = 1;
  string slug = 2; // novel, screenplay, comic_script, poetry, interactive_fiction, tabletop_rpg, memoir, lyrics
  string name = 3;
  string description = 4;
  string icon = 5;
}

message Workspace {
  string id          = 1;
  string name        = 2;
  string slug        = 3;
  string type        = 4; // personal | org
  string owner_id    = 5;
  string avatar_url  = 6;
  string description = 7;
  repeated Category categories = 8;
  common.Timestamp created_at  = 9;
  common.Timestamp updated_at  = 10;
}

message WorkspaceMember {
  string id           = 1;
  string workspace_id = 2;
  string user_id      = 3;
  string role         = 4; // owner | admin | editor | viewer
  string invited_by   = 5;
  common.Timestamp joined_at  = 6;
  common.Timestamp created_at = 7;
}

// Organization is a first-class team entity (distinct from a personal
// workspace). It owns projects directly and bills its own seats. Members
// connect their personal account to the org via OrgMember rows.
message Organization {
  string id          = 1;
  string name        = 2;
  string slug        = 3;
  string owner_id    = 4;
  string avatar_url  = 5;
  string description = 6;
  // member_role is the requesting user's role in this org, populated by the
  // user-scoped reads (list/get). Empty when the caller context is unknown.
  string member_role = 7;
  common.Timestamp created_at = 8;
  common.Timestamp updated_at = 9;
}

message OrgMember {
  string id         = 1;
  string org_id     = 2;
  string user_id    = 3;
  string role       = 4; // owner | admin | editor | viewer
  string invited_by = 5;
  common.Timestamp joined_at  = 6;
  common.Timestamp created_at = 7;
}

// ─── Category RPCs ───────────────────────────────────────────────────────────

message ListCategoriesRequest {}

message ListCategoriesResponse {
  repeated Category categories = 1;
}

// ─── Workspace RPCs ──────────────────────────────────────────────────────────

message CreatePersonalWorkspacesRequest {
  string user_id = 1; // called on registration, creates one workspace per category slug provided
  repeated string category_slugs = 2;
}

message CreatePersonalWorkspacesResponse {
  repeated Workspace workspaces = 1;
}

message CreateOrgWorkspaceRequest {
  string owner_id        = 1;
  string name            = 2;
  string description     = 3;
  repeated string category_slugs = 4;
}

message CreateOrgWorkspaceResponse {
  Workspace workspace = 1;
}

message GetWorkspaceRequest {
  string workspace_id = 1;
}

message GetWorkspaceResponse {
  Workspace workspace = 1;
}

message ListUserWorkspacesRequest {
  string user_id = 1;
}

message ListUserWorkspacesResponse {
  repeated Workspace personal  = 1;
  repeated Workspace org       = 2;
}

message UpdateWorkspaceRequest {
  string workspace_id = 1;
  string name         = 2;
  string description  = 3;
  string avatar_url   = 4;
}

message UpdateWorkspaceResponse {
  Workspace workspace = 1;
}

message DeleteWorkspaceRequest {
  string workspace_id = 1;
  string user_id      = 2; // must be owner
}

message DeleteWorkspaceResponse {
  bool success = 1;
}

// ─── Category enable/disable (org workspaces only) ───────────────────────────

message EnableCategoryRequest {
  string workspace_id   = 1;
  string category_slug  = 2;
}

message EnableCategoryResponse {
  Workspace workspace = 1;
}

message DisableCategoryRequest {
  string workspace_id   = 1;
  string category_slug  = 2;
}

message DisableCategoryResponse {
  Workspace workspace = 1;
}

// ─── Members ─────────────────────────────────────────────────────────────────

message AddMemberRequest {
  string workspace_id = 1;
  string user_id      = 2;
  string role         = 3;
  string invited_by   = 4;
}

message AddMemberResponse {
  WorkspaceMember member = 1;
}

message RemoveMemberRequest {
  string workspace_id = 1;
  string user_id      = 2;
}

message RemoveMemberResponse {
  bool success = 1;
}

message UpdateMemberRoleRequest {
  string workspace_id = 1;
  string user_id      = 2;
  string role         = 3;
}

message UpdateMemberRoleResponse {
  WorkspaceMember member = 1;
}

message ListMembersRequest {
  string workspace_id = 1;
}
message CountOwnerSeatsRequest {
  string owner_id = 1;
}
message CountOwnerSeatsResponse {
  int32 seats = 1;
}

message ListMembersResponse {
  repeated WorkspaceMember members = 1;
}

// ─── Invites ─────────────────────────────────────────────────────────────────

message InviteMemberRequest {
  string workspace_id = 1;
  string email        = 2;
  string role         = 3;
  string invited_by   = 4;
}

message InviteMemberResponse {
  string invite_token = 1;
}

message AcceptInviteRequest {
  string token   = 1;
  string user_id = 2;
}

message AcceptInviteResponse {
  Workspace workspace = 1;
}

message DeclineInviteRequest {
  string token = 1;
}

message DeclineInviteResponse {
  bool success = 1;
}

// ─── Organization RPCs ───────────────────────────────────────────────────────

message CreateOrganizationRequest {
  string owner_id    = 1;
  string name        = 2;
  string description = 3;
}

message CreateOrganizationResponse {
  Organization organization = 1;
}

message GetOrganizationRequest {
  string org_id  = 1;
  string user_id = 2; // optional; when set, fills Organization.member_role
}

message GetOrganizationResponse {
  Organization organization = 1;
}

message ListOrganizationsForUserRequest {
  string user_id = 1;
}

message ListOrganizationsForUserResponse {
  repeated Organization organizations = 1;
}

message UpdateOrganizationRequest {
  string org_id      = 1;
  string name        = 2;
  string description  = 3;
  string avatar_url  = 4;
}

message UpdateOrganizationResponse {
  Organization organization = 1;
}

message DeleteOrganizationRequest {
  string org_id  = 1;
  string user_id = 2; // must be owner
}

message DeleteOrganizationResponse {
  bool success = 1;
}

// ─── Organization members ────────────────────────────────────────────────────

message AddOrgMemberRequest {
  string org_id     = 1;
  string user_id    = 2;
  string role       = 3;
  string invited_by = 4;
}

message AddOrgMemberResponse {
  OrgMember member = 1;
}

message GetOrgMemberRequest {
  string org_id  = 1;
  string user_id = 2;
}

message GetOrgMemberResponse {
  OrgMember member = 1;
}

message RemoveOrgMemberRequest {
  string org_id  = 1;
  string user_id = 2;
}

message RemoveOrgMemberResponse {
  bool success = 1;
}

message UpdateOrgMemberRoleRequest {
  string org_id  = 1;
  string user_id = 2;
  string role    = 3;
}

message UpdateOrgMemberRoleResponse {
  OrgMember member = 1;
}

message ListOrgMembersRequest {
  string org_id = 1;
}

message ListOrgMembersResponse {
  repeated OrgMember members = 1;
}

message CountOrgSeatsRequest {
  string org_id = 1;
}

message CountOrgSeatsResponse {
  int32 seats = 1;
}

// ─── Organization invites ────────────────────────────────────────────────────

message InviteOrgMemberRequest {
  string org_id     = 1;
  string email      = 2;
  string role       = 3;
  string invited_by = 4;
}

message InviteOrgMemberResponse {
  string invite_token = 1;
}

message AcceptOrgInviteRequest {
  string token   = 1;
  string user_id = 2;
}

message AcceptOrgInviteResponse {
  Organization organization = 1;
}

message DeclineOrgInviteRequest {
  string token = 1;
}

message DeclineOrgInviteResponse {
  bool success = 1;
}

// ─── Service ─────────────────────────────────────────────────────────────────

service WorkspaceService {
  // Categories
  rpc ListCategories(ListCategoriesRequest) returns (ListCategoriesResponse);

  // Workspaces
  rpc CreatePersonalWorkspaces(CreatePersonalWorkspacesRequest) returns (CreatePersonalWorkspacesResponse);
  rpc CreateOrgWorkspace(CreateOrgWorkspaceRequest) returns (CreateOrgWorkspaceResponse);
  rpc GetWorkspace(GetWorkspaceRequest) returns (GetWorkspaceResponse);
  rpc ListUserWorkspaces(ListUserWorkspacesRequest) returns (ListUserWorkspacesResponse);
  rpc UpdateWorkspace(UpdateWorkspaceRequest) returns (UpdateWorkspaceResponse);
  rpc DeleteWorkspace(DeleteWorkspaceRequest) returns (DeleteWorkspaceResponse);

  // Workspace categories (org only)
  rpc EnableCategory(EnableCategoryRequest) returns (EnableCategoryResponse);
  rpc DisableCategory(DisableCategoryRequest) returns (DisableCategoryResponse);

  // Members
  rpc AddMember(AddMemberRequest) returns (AddMemberResponse);
  rpc RemoveMember(RemoveMemberRequest) returns (RemoveMemberResponse);
  rpc UpdateMemberRole(UpdateMemberRoleRequest) returns (UpdateMemberRoleResponse);
  rpc ListMembers(ListMembersRequest) returns (ListMembersResponse);
  rpc CountOwnerSeats(CountOwnerSeatsRequest) returns (CountOwnerSeatsResponse);

  // Invites
  rpc InviteMember(InviteMemberRequest) returns (InviteMemberResponse);
  rpc AcceptInvite(AcceptInviteRequest) returns (AcceptInviteResponse);
  rpc DeclineInvite(DeclineInviteRequest) returns (DeclineInviteResponse);

  // Organizations (first-class team entity)
  rpc CreateOrganization(CreateOrganizationRequest) returns (CreateOrganizationResponse);
  rpc GetOrganization(GetOrganizationRequest) returns (GetOrganizationResponse);
  rpc ListOrganizationsForUser(ListOrganizationsForUserRequest) returns (ListOrganizationsForUserResponse);
  rpc UpdateOrganization(UpdateOrganizationRequest) returns (UpdateOrganizationResponse);
  rpc DeleteOrganization(DeleteOrganizationRequest) returns (DeleteOrganizationResponse);

  // Organization members
  rpc AddOrgMember(AddOrgMemberRequest) returns (AddOrgMemberResponse);
  rpc GetOrgMember(GetOrgMemberRequest) returns (GetOrgMemberResponse);
  rpc RemoveOrgMember(RemoveOrgMemberRequest) returns (RemoveOrgMemberResponse);
  rpc UpdateOrgMemberRole(UpdateOrgMemberRoleRequest) returns (UpdateOrgMemberRoleResponse);
  rpc ListOrgMembers(ListOrgMembersRequest) returns (ListOrgMembersResponse);
  rpc CountOrgSeats(CountOrgSeatsRequest) returns (CountOrgSeatsResponse);

  // Organization invites
  rpc InviteOrgMember(InviteOrgMemberRequest) returns (InviteOrgMemberResponse);
  rpc AcceptOrgInvite(AcceptOrgInviteRequest) returns (AcceptOrgInviteResponse);
  rpc DeclineOrgInvite(DeclineOrgInviteRequest) returns (DeclineOrgInviteResponse);
}
