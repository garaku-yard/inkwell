// CallerRole is the access level the gateway resolved for the caller on the
// target project and is asserting for this call — set exclusively by the
// gateway (handlers.ResolveProjectRole), never derived from client input.
// Replaces the empty-user_id bypass sentinel (Orbit #360): user_id is now
// always the real authenticated actor, and this field carries what the
// gateway determined about them instead of emptiness carrying meaning.
//
// scripts-service does not treat this as ground truth for ownership — it
// always re-verifies literal ownership itself (projects.owner_id) before
// trusting anything else, so a misapplied or stale CALLER_ROLE_OWNER cannot
// grant owner-level access on its own (mirrors the same rule the gateway
// enforces for a collab collaborator row, ADR 0030). For every other value,
// scripts has no independent way to verify org or collaborator membership
// (and is not meant to — that stays the gateway's job per 0029) and trusts
// the gateway's resolution once an actor identity is present; a
// CALLER_ROLE_UNSPECIFIED value is rejected the same as a missing actor.
enum CallerRole {
  CALLER_ROLE_UNSPECIFIED = 0;
  CALLER_ROLE_VIEWER = 1;
  CALLER_ROLE_EDITOR = 2;
  CALLER_ROLE_ORG_ADMIN = 3;
  CALLER_ROLE_OWNER = 4;
}

// ResourceType identifies a beat-board or script sub-resource for
// GetResourceProject. The gateway uses it to resolve which project owns a
// resource so it can authorize a mutation against that project.
enum ResourceType {
  RESOURCE_TYPE_UNSPECIFIED = 0;
  RESOURCE_TYPE_BEAT = 1;
  RESOURCE_TYPE_CONNECTION = 2;
  RESOURCE_TYPE_LANE = 3;
  RESOURCE_TYPE_OUTLINE_ITEM = 4;
  RESOURCE_TYPE_ELEMENT = 5;
  RESOURCE_TYPE_DRAWING = 6;
  // Added for Orbit #359: scenes had no resolver, so the gateway could not
  // authorize UpdateScene/DeleteScene/GetSceneElements against the scene's
  // real project and fell back to trusting the raw caller id or an
  // unconditional bypass-and-retry (see the ADR 0029 gap this closes).
  RESOURCE_TYPE_SCENE = 7;
}

message GetResourceProjectRequest {
  ResourceType resource_type = 1;
  string resource_id = 2;
}

message GetResourceProjectResponse {
  string project_id = 1;
}

// GetProjectAccessMetadata is a narrow internal lookup used while the gateway
// is resolving access or enforcing owner-scoped quotas. It is not "read this
// project": it returns only the ownership fields needed for those decisions
// and performs no authorization itself, like GetResourceProject. Added for
// Orbit #360 to replace GetProject's overloaded empty-user_id bypass.
message GetProjectAccessMetadataRequest {
  string project_id = 1;
}

message GetProjectAccessMetadataResponse {
  string org_id = 1;
  string owner_id = 2;
}

message GetProjectLocationsRequest {
  string project_id = 1;
  string user_id = 2; // For authorization check
}

message GetProjectLocationsResponse {
  repeated Location locations = 1;
}

// Scripts service definition
// ─── Sync ───────────────────────────────────────────────────────────────────

// SyncChanges bundles rows for one project, used in both directions of a sync
// round-trip. Each row carries its own deleted_at (a tombstone when set). The
// project field is the project row itself — optional on push (only set when the
// project row changed), always set by the server on a full pull.
message SyncChanges {
  Project project = 1;
  repeated Scene scenes = 2;
  repeated ProjectElement elements = 3;
  repeated Character characters = 4;
  repeated Location locations = 5;
  repeated Beat beats = 6;
  repeated Connection connections = 7;
  repeated Lane lanes = 8;
  repeated OutlineItem outline_items = 9;
  repeated Drawing drawings = 10;
}

message SyncProjectRequest {
  string project_id = 1;
  string owner_id = 2;         // the authenticated caller (gateway-supplied)
  common.Timestamp cursor = 3; // unset/zero ⇒ full pull (first sync / fresh device)
  SyncChanges changes = 4;     // the caller's local changes since its cursor
}

message SyncProjectResponse {
  SyncChanges changes = 1;     // server rows changed since the request cursor
  common.Timestamp cursor = 2; // new high-water for the caller to store
}

// ─── Vault sync (path-keyed file sync) ───────────────────────────────────────

// VaultFile is one file in a vault project, keyed by its vault-relative path
// (forward-slash separated). content holds the raw bytes — markdown as UTF-8,
// attachments (images/PDFs/…) as their binary. A set deleted_at is a tombstone.
// updated_at is server-stamped and only meaningful on a pull. content is omitted
// on tombstones and may be empty on a delta the caller already holds by hash.
message VaultFile {
  string path = 1;
  bytes content = 2;
  string content_hash = 3;        // sha-256 hex of content (integrity + compare)
  common.Timestamp updated_at = 4;
  common.Timestamp deleted_at = 5;
}

// VaultCursor is a keyset position into a project's vault files ordered by
// (updated_at, path), so a large first pull can page without skipping files that
// share an updated_at. Unset ⇒ full pull from the beginning.
message VaultCursor {
  common.Timestamp updated_at = 1;
  string path = 2;
}

message SyncVaultRequest {
  string project_id = 1;
  string owner_id = 2;            // authenticated caller (gateway-supplied)
  VaultCursor cursor = 3;         // unset ⇒ full pull (first sync / fresh device)
  Project project = 4;            // project row to upsert (create-if-absent on first sync)
  repeated VaultFile files = 5;   // the caller's locally-changed files since its cursor
}

message SyncVaultResponse {
  repeated VaultFile files = 1;   // server files changed since the cursor (one page)
  VaultCursor cursor = 2;         // new keyset high-water for the caller to store
  bool has_more = 3;              // true ⇒ more pages remain; call again with this cursor
}

service ScriptsService {
  // Project management (Project now represents the screenplay)
  rpc CreateProject(CreateProjectRequest) returns (CreateProjectResponse);
  rpc GetProject(GetProjectRequest) returns (GetProjectResponse);
  rpc UpdateProject(UpdateProjectRequest) returns (UpdateProjectResponse);
  rpc ToggleProjectStar(ToggleProjectStarRequest) returns (ToggleProjectStarResponse);
  rpc DeleteProject(DeleteProjectRequest) returns (DeleteProjectResponse);
  rpc GetUserProjects(GetUserProjectsRequest) returns (GetUserProjectsResponse);
  rpc GetOrgProjects(GetOrgProjectsRequest) returns (GetOrgProjectsResponse);

  // Outline unit management (acts, sequences, beats, sub-beats)
  rpc CreateOutlineUnit(CreateOutlineUnitRequest) returns (CreateOutlineUnitResponse);
  rpc GetProjectOutline(GetProjectOutlineRequest) returns (GetProjectOutlineResponse);
  rpc UpdateOutlineUnit(UpdateOutlineUnitRequest) returns (UpdateOutlineUnitResponse);
  rpc DeleteOutlineUnit(DeleteOutlineUnitRequest) returns (DeleteOutlineUnitResponse);
  
  // Scene management
  rpc CreateScene(CreateSceneRequest) returns (CreateSceneResponse);
  rpc GetProjectScenes(GetProjectScenesRequest) returns (GetProjectScenesResponse);
  rpc UpdateScene(UpdateSceneRequest) returns (UpdateSceneResponse);
  rpc DeleteScene(DeleteSceneRequest) returns (DeleteSceneResponse);
  
  // Character management
  rpc CreateCharacter(CreateCharacterRequest) returns (CreateCharacterResponse);
  rpc GetProjectCharacters(GetProjectCharactersRequest) returns (GetProjectCharactersResponse);
  rpc UpdateCharacter(UpdateCharacterRequest) returns (UpdateCharacterResponse);
  
  // Location management
  rpc CreateLocation(CreateLocationRequest) returns (CreateLocationResponse);
  rpc GetProjectLocations(GetProjectLocationsRequest) returns (GetProjectLocationsResponse);
  
  // Element operations. CreateElement / UpdateElement / GetSceneElements back
  // the gateway's element CRUD; DeleteScriptElement deletes by id;
  // BatchCreateElements persists a scene's elements in one call (FDX import).
  rpc CreateElement(CreateElementRequest) returns (CreateElementResponse);
  rpc UpdateElement(UpdateElementRequest) returns (UpdateElementResponse);
  rpc GetSceneElements(GetSceneElementsRequest) returns (GetSceneElementsResponse);
  rpc DeleteScriptElement(DeleteScriptElementRequest) returns (DeleteScriptElementResponse);
  rpc BatchCreateElements(BatchCreateElementsRequest) returns (BatchCreateElementsResponse);
  
  // Beat Board management
  rpc CreateBeat(CreateBeatRequest) returns (CreateBeatResponse);
  rpc GetBeat(GetBeatRequest) returns (GetBeatResponse);
  rpc GetProjectBeatBoard(GetProjectBeatBoardRequest) returns (GetProjectBeatBoardResponse);
  rpc UpdateBeat(UpdateBeatRequest) returns (UpdateBeatResponse);
  rpc DeleteBeat(DeleteBeatRequest) returns (DeleteBeatResponse);
  
  rpc CreateConnection(CreateConnectionRequest) returns (CreateConnectionResponse);
  rpc DeleteConnection(DeleteConnectionRequest) returns (DeleteConnectionResponse);
  
  rpc CreateLane(CreateLaneRequest) returns (CreateLaneResponse);
  rpc GetProjectLanes(GetProjectLanesRequest) returns (GetProjectLanesResponse);
  rpc UpdateLane(UpdateLaneRequest) returns (UpdateLaneResponse);
  rpc UpdateLaneOrder(UpdateLaneOrderRequest) returns (UpdateLaneOrderResponse);
  rpc DeleteLane(DeleteLaneRequest) returns (DeleteLaneResponse);
  
  rpc CreateOutlineItem(CreateOutlineItemRequest) returns (CreateOutlineItemResponse);
  rpc UpdateOutlineItem(UpdateOutlineItemRequest) returns (UpdateOutlineItemResponse);
  rpc DeleteOutlineItem(DeleteOutlineItemRequest) returns (DeleteOutlineItemResponse);

  // Drawing layer (decisions/0022) — one row per shape.
  rpc CreateDrawing(CreateDrawingRequest) returns (CreateDrawingResponse);
  rpc UpdateDrawing(UpdateDrawingRequest) returns (UpdateDrawingResponse);
  rpc DeleteDrawing(DeleteDrawingRequest) returns (DeleteDrawingResponse);

  // GetResourceProject resolves which project owns a sub-resource (beat, lane,
  // connection, outline item, or element). The gateway calls it to authorize
  // mutations against the resource's real project. It is an internal lookup —
  // no ownership check — so the gateway must authorize the returned project.
  rpc GetResourceProject(GetResourceProjectRequest) returns (GetResourceProjectResponse);

  // Narrow ownership metadata for gateway authorization and quota decisions.
  rpc GetProjectAccessMetadata(GetProjectAccessMetadataRequest) returns (GetProjectAccessMetadataResponse);

  // SyncProject reconciles one project bidirectionally: it applies the caller's
  // pushed changes (upsert-by-id, server-stamped updated_at, last-sync-wins) and
  // returns every row changed since the caller's cursor. See SYNC_DESIGN.md.
  rpc SyncProject(SyncProjectRequest) returns (SyncProjectResponse);

  // SyncVault reconciles a vault project's files bidirectionally, keyed by path
  // (upsert-by-path, server-stamped updated_at, last-sync-wins). Paginated: when
  // the response sets has_more, call again with the returned cursor until it is
  // false. See SYNC_DESIGN.md ("vault file sync").
  rpc SyncVault(SyncVaultRequest) returns (SyncVaultResponse);
}
