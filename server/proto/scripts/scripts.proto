syntax = "proto3";

package scripts;

option go_package = "scriptlith/server/pkg/grpc/scripts";

import "common/types.proto";

// Project entity
message Project {
  string id = 1;
  string title = 2;
  string description = 3;
  string owner_id = 4;
  common.Timestamp created_at = 5;
  common.Timestamp updated_at = 6;
  string status = 7; // "draft", "active", "completed", "archived"
  bool is_starred = 8;
  string category = 9; // "screenplay", "novel", "comic_script", "poetry", "interactive_fiction", "tabletop_rpg", "memoir", "lyrics"
}

// Note: Screenplay is now represented by Project entity
// The Project contains the script content through ScriptElements

// Scene entity
message Scene {
  string id = 1;
  string project_id = 2;
  string outline_unit_id = 3; // Optional link to outline unit
  string scene_heading = 4; // INT./EXT. LOCATION - TIME
  string content = 5; // Scene content/action
  int32 order_index = 6;
  common.Timestamp created_at = 7;
  common.Timestamp updated_at = 8;
}

// Script element entity (individual lines/elements of a screenplay)
message ScriptElement {
  string id = 1;
  string project_id = 2; // Changed from screenplay_id to project_id
  string scene_id = 3; // Required link to scene - elements must belong to a scene
  string type = 4; // "scene_heading", "character", "dialogue", "action", "parenthetical", "transition", "shot"
  string content = 5; // The actual text content
  string character_id = 6; // For dialogue elements, link to character
  int32 line_number = 7; // Position in screenplay
  map<string, string> formatting = 8; // Additional formatting attributes
  common.Timestamp created_at = 9;
  common.Timestamp updated_at = 10;
}

// Unified outline unit entity (acts, sequences, beats, sub-beats)
message OutlineUnit {
  string id = 1;
  string project_id = 2;
  string parent_id = 3; // For hierarchical structure
  string type = 4; // "act", "sequence", "beat", "sub-beat"
  string title = 5;
  string description = 6;
  string color = 7; // For color coding in editor
  repeated string tags = 8; // Array of tags
  string icon = 9; // Icon name for display
  string scene_id = 10; // Optional link to scene
  int32 order_index = 11;
  common.Timestamp created_at = 12;
  common.Timestamp updated_at = 13;
}

// Character entity
message Character {
  string id = 1;
  string project_id = 2;
  string name = 3;
  string description = 4;
  string role = 5; // "protagonist", "antagonist", "supporting", etc.
  map<string, string> attributes = 6; // Key-value pairs for character traits
  common.Timestamp created_at = 7;
  common.Timestamp updated_at = 8;
}

// Location entity
message Location {
  string id = 1;
  string project_id = 2;
  string name = 3;
  string description = 4;
  string type = 5; // "interior", "exterior"
  common.Timestamp created_at = 6;
  common.Timestamp updated_at = 7;
}

// Beat Board entities
message Beat {
  string id = 1;
  string project_id = 2;
  string title = 3;
  string description = 4;
  string scene_numbers = 5; // DEPRECATED: Use start_page and end_page
  string color = 6;
  double position_x = 7;
  double position_y = 8;
  double width = 9;
  double height = 10;
  int32 act_number = 11;
  int32 order = 12;
  common.Timestamp created_at = 13;
  common.Timestamp updated_at = 14;
  int32 start_page = 15;
  int32 end_page = 16;
  optional string image_url = 17;
}

message Connection {
  string id = 1;
  string project_id = 2;
  string from_beat_id = 3;
  string to_beat_id = 4;
  string from_side = 5; // "top", "right", "bottom", "left"
  string to_side = 6;
  common.Timestamp created_at = 7;
}

message Lane {
  string id = 1;
  string project_id = 2;
  string name = 3;
  string color = 4;
  int32 order = 5;
  common.Timestamp created_at = 6;
  common.Timestamp updated_at = 7;
}

message OutlineItem {
  string id = 1;
  string project_id = 2;
  string beat_id = 3;
  string lane_id = 4;
  int32 order = 5;
  double timeline_position = 6;
  double width = 7;
  common.Timestamp created_at = 8;
  common.Timestamp updated_at = 9;
}

message BeatBoardData {
  repeated Beat beats = 1;
  repeated Connection connections = 2;
  repeated Lane lanes = 3;
  repeated OutlineItem outline_items = 4;
}

// Project requests/responses
message CreateProjectRequest {
  string title = 1;
  string description = 2;
  string owner_id = 3;
  string category = 4;
}

message CreateProjectResponse {
  Project project = 1;
}

message GetProjectRequest {
  string project_id = 1;
  string user_id = 2; // For authorization check
}

message GetProjectResponse {
  Project project = 1;
}

message UpdateProjectRequest {
  string project_id = 1;
  string user_id = 2; // For authorization check
  optional string title = 3;
  optional string description = 4;
  optional string status = 5;
}

message UpdateProjectResponse {
  Project project = 1;
}

message ToggleProjectStarRequest {
  string project_id = 1;
  string user_id = 2; // For authorization check
}

message ToggleProjectStarResponse {
  Project project = 1;
}

message DeleteProjectRequest {
  string project_id = 1;
  string user_id = 2; // For authorization check
}

message DeleteProjectResponse {
  bool success = 1;
}

message GetUserProjectsRequest {
  string user_id = 1;
  common.PaginationRequest pagination = 2;
}

message GetUserProjectsResponse {
  repeated Project projects = 1;
  common.PaginationResponse pagination = 2;
}

// Script content is now managed through ScriptElements linked to Project

// Outline unit requests/responses
message CreateOutlineUnitRequest {
  string project_id = 1;
  string user_id = 2; // For authorization check
  optional string parent_id = 3;
  string type = 4; // "act", "sequence", "beat", "sub-beat"
  string title = 5;
  string description = 6;
  optional string color = 7;
  repeated string tags = 8;
  optional string icon = 9;
  optional string scene_id = 10;
  int32 order_index = 11;
}

message CreateOutlineUnitResponse {
  OutlineUnit outline_unit = 1;
}

message GetProjectOutlineRequest {
  string project_id = 1;
  string user_id = 2; // For authorization check
  optional string type_filter = 3; // Filter by type
}

message GetProjectOutlineResponse {
  repeated OutlineUnit outline_units = 1;
}

message UpdateOutlineUnitRequest {
  string outline_unit_id = 1;
  string user_id = 2; // For authorization check
  optional string parent_id = 3;
  optional string type = 4;
  optional string title = 5;
  optional string description = 6;
  optional string color = 7;
  repeated string tags = 8;
  optional string icon = 9;
  optional string scene_id = 10;
  optional int32 order_index = 11;
}

message UpdateOutlineUnitResponse {
  OutlineUnit outline_unit = 1;
}

message DeleteOutlineUnitRequest {
  string outline_unit_id = 1;
  string user_id = 2; // For authorization check
}

message DeleteOutlineUnitResponse {
  bool success = 1;
}

// Scene requests/responses
message CreateSceneRequest {
  string project_id = 1;
  string user_id = 2; // For authorization check
  optional string outline_unit_id = 3;
  string scene_heading = 4;
  string content = 5;
  int32 order_index = 6;
}

message CreateSceneResponse {
  Scene scene = 1;
}

message GetProjectScenesRequest {
  string project_id = 1;
  string user_id = 2; // For authorization check
}

message GetProjectScenesResponse {
  repeated Scene scenes = 1;
}

message UpdateSceneRequest {
  string scene_id = 1;
  string user_id = 2; // For authorization check
  optional string outline_unit_id = 3;
  optional string scene_heading = 4;
  optional string content = 5;
  optional int32 order_index = 6;
}

message UpdateSceneResponse {
  Scene scene = 1;
}

message DeleteSceneRequest {
  string scene_id = 1;
  string user_id = 2; // For authorization check
}

message DeleteSceneResponse {
  bool success = 1;
}

// Character requests/responses
message CreateCharacterRequest {
  string project_id = 1;
  string user_id = 2; // For authorization check
  string name = 3;
  string description = 4;
  string role = 5;
  map<string, string> attributes = 6;
}

message CreateCharacterResponse {
  Character character = 1;
}

message GetProjectCharactersRequest {
  string project_id = 1;
  string user_id = 2; // For authorization check
}

message GetProjectCharactersResponse {
  repeated Character characters = 1;
}

message UpdateCharacterRequest {
  string character_id = 1;
  string user_id = 2; // For authorization check
  optional string name = 3;
  optional string description = 4;
  optional string role = 5;
  map<string, string> attributes = 6;
}

message UpdateCharacterResponse {
  Character character = 1;
}

// Location requests/responses
message CreateLocationRequest {
  string project_id = 1;
  string user_id = 2; // For authorization check
  string name = 3;
  string description = 4;
  string type = 5;
}

message CreateLocationResponse {
  Location location = 1;
}

message UpdateLocationResponse {
  Location location = 1;
}

// Script element requests/responses
message CreateScriptElementRequest {
  string project_id = 1; // Changed from screenplay_id to project_id
  string user_id = 2; // For authorization check
  optional string scene_id = 3;
  string type = 4;
  string content = 5;
  optional string character_id = 6;
  int32 line_number = 7;
  map<string, string> formatting = 8;
}

message CreateScriptElementResponse {
  ScriptElement script_element = 1;
}

message GetProjectScriptElementsRequest {
  string project_id = 1; // Changed from screenplay_id to project_id
  string user_id = 2; // For authorization check
  optional int32 start_line = 3; // For pagination
  optional int32 end_line = 4;
}

message GetProjectScriptElementsResponse {
  repeated ScriptElement script_elements = 1;
}

message UpdateScriptElementRequest {
  string script_element_id = 1;
  string user_id = 2; // For authorization check
  optional string content = 3;
  optional string type = 4;
  optional string character_id = 5;
  optional int32 line_number = 6;
  map<string, string> formatting = 7;
}

message UpdateScriptElementResponse {
  ScriptElement script_element = 1;
}

message DeleteScriptElementRequest {
  string script_element_id = 1;
  string user_id = 2; // For authorization check
}

message DeleteScriptElementResponse {
  bool success = 1;
}

// Simplified Element operations for gateway
message CreateElementRequest {
  string project_id = 1;
  string user_id = 2;
  string scene_id = 3;
  string element_type = 4; // "ACTION", "CHARACTER", "DIALOG", "PARENTHETICAL", "SHOT", "TRANSITION"
  string content = 5;
  optional string character_id = 6;
  int32 line_number = 7;
  map<string, string> formatting = 8;
}

message CreateElementResponse {
  ScriptElement element = 1;
}

message UpdateElementRequest {
  string element_id = 1;
  string user_id = 2;
  string content = 3;
  string type = 4;
}

message UpdateElementResponse {
  ScriptElement element = 1;
}

message GetSceneElementsRequest {
  string scene_id = 1;
  string user_id = 2;
}

message GetSceneElementsResponse {
  repeated ScriptElement elements = 1;
}

// Bulk operations for real-time editing
message BulkUpdateScriptElementsRequest {
  string project_id = 1; // Changed from screenplay_id to project_id
  string user_id = 2;
  repeated ScriptElement elements = 3;
}

message BulkUpdateScriptElementsResponse {
  repeated ScriptElement updated_elements = 1;
}

// Batch create elements for imports
message BatchCreateElementsRequest {
  string project_id = 1;
  string user_id = 2;
  repeated ScriptElement elements = 3;
}

message BatchCreateElementsResponse {
  repeated ScriptElement created_elements = 1;
}

// Beat Board requests/responses
message CreateBeatRequest {
  string project_id = 1;
  string user_id = 2;
  string title = 3;
  string description = 4;
  string scene_numbers = 5; // DEPRECATED: Use start_page and end_page
  string color = 6;
  double position_x = 7;
  double position_y = 8;
  double width = 9;
  double height = 10;
  int32 act_number = 11;
  int32 order = 12;
  int32 start_page = 13;
  int32 end_page = 14;
  optional string image_url = 15;
}

message CreateBeatResponse {
  Beat beat = 1;
}

message GetBeatRequest {
  string beat_id = 1;
  string user_id = 2;
}

message GetBeatResponse {
  Beat beat = 1;
}

message GetProjectBeatBoardRequest {
  string project_id = 1;
  string user_id = 2;
}

message GetProjectBeatBoardResponse {
  BeatBoardData beat_board = 1;
}

message UpdateBeatRequest {
  string beat_id = 1;
  string user_id = 2;
  optional string title = 3;
  optional string description = 4;
  optional string scene_numbers = 5; // DEPRECATED: Use start_page and end_page
  optional string color = 6;
  optional double position_x = 7;
  optional double position_y = 8;
  optional double width = 9;
  optional double height = 10;
  optional int32 act_number = 11;
  optional int32 order = 12;
  optional int32 start_page = 13;
  optional int32 end_page = 14;
  optional string image_url = 15;
}

message UpdateBeatResponse {
  Beat beat = 1;
}

message DeleteBeatRequest {
  string beat_id = 1;
  string user_id = 2;
}

message DeleteBeatResponse {
  bool success = 1;
}

message CreateConnectionRequest {
  string project_id = 1;
  string user_id = 2;
  string from_beat_id = 3;
  string to_beat_id = 4;
  string from_side = 5;
  string to_side = 6;
}

message CreateConnectionResponse {
  Connection connection = 1;
}

message DeleteConnectionRequest {
  string connection_id = 1;
  string user_id = 2;
}

message DeleteConnectionResponse {
  bool success = 1;
}

message CreateLaneRequest {
  string project_id = 1;
  string user_id = 2;
  string name = 3;
  string color = 4;
  int32 order = 5;
}

message CreateLaneResponse {
  Lane lane = 1;
}

message GetProjectLanesRequest {
  string project_id = 1;
  string user_id = 2;
}

message GetProjectLanesResponse {
  repeated Lane lanes = 1;
}

message UpdateLaneRequest {
  string lane_id = 1;
  string user_id = 2;
  optional string name = 3;
  optional string color = 4;
  optional int32 order = 5;
}

message UpdateLaneResponse {
  Lane lane = 1;
}

message UpdateLaneOrderRequest {
  string project_id = 1;
  string user_id = 2;
  repeated string lane_ids = 3;
}

message UpdateLaneOrderResponse {
  bool success = 1;
}

message DeleteLaneRequest {
  string lane_id = 1;
  string user_id = 2;
}

message DeleteLaneResponse {
  bool success = 1;
}

message CreateOutlineItemRequest {
  string project_id = 1;
  string user_id = 2;
  string beat_id = 3;
  string lane_id = 4;
  int32 order = 5;
  double timeline_position = 6;
  double width = 7;
}

message CreateOutlineItemResponse {
  OutlineItem outline_item = 1;
}

message UpdateOutlineItemRequest {
  string outline_item_id = 1;
  string user_id = 2;
  optional string beat_id = 3;
  optional string lane_id = 4;
  optional int32 order = 5;
  optional double timeline_position = 6;
  optional double width = 7;
}

message UpdateOutlineItemResponse {
  OutlineItem outline_item = 1;
}

message DeleteOutlineItemRequest {
  string outline_item_id = 1;
  string user_id = 2;
}

message DeleteOutlineItemResponse {
  bool success = 1;
}

message GetProjectLocationsRequest {
  string project_id = 1;
  string user_id = 2; // For authorization check
}

message GetProjectLocationsResponse {
  repeated Location locations = 1;
}

// Scripts service definition
service ScriptsService {
  // Project management (Project now represents the screenplay)
  rpc CreateProject(CreateProjectRequest) returns (CreateProjectResponse);
  rpc GetProject(GetProjectRequest) returns (GetProjectResponse);
  rpc UpdateProject(UpdateProjectRequest) returns (UpdateProjectResponse);
  rpc ToggleProjectStar(ToggleProjectStarRequest) returns (ToggleProjectStarResponse);
  rpc DeleteProject(DeleteProjectRequest) returns (DeleteProjectResponse);
  rpc GetUserProjects(GetUserProjectsRequest) returns (GetUserProjectsResponse);
  
  // Outline unit management (acts, sequences, beats, sub-beats)
  rpc CreateOutlineUnit(CreateOutlineUnitRequest) returns (CreateOutlineUnitResponse);
  rpc GetProjectOutline(GetProjectOutlineRequest) returns (GetProjectOutlineResponse);
  rpc UpdateOutlineUnit(UpdateOutlineUnitRequest) returns (UpdateOutlineUnitResponse);
  rpc DeleteOutlineUnit(DeleteOutlineUnitRequest) returns (DeleteOutlineUnitResponse);
  
  // Scene management
  rpc CreateScene(CreateSceneRequest) returns (CreateSceneResponse);
  rpc GetProjectScenes(GetProjectScenesRequest) returns (GetProjectScenesResponse);
  rpc UpdateScene(UpdateSceneRequest) returns (UpdateSceneResponse);
  rpc DeleteScene(DeleteSceneRequest) returns (DeleteSceneResponse);
  
  // Character management
  rpc CreateCharacter(CreateCharacterRequest) returns (CreateCharacterResponse);
  rpc GetProjectCharacters(GetProjectCharactersRequest) returns (GetProjectCharactersResponse);
  rpc UpdateCharacter(UpdateCharacterRequest) returns (UpdateCharacterResponse);
  
  // Location management
  rpc CreateLocation(CreateLocationRequest) returns (CreateLocationResponse);
  rpc GetProjectLocations(GetProjectLocationsRequest) returns (GetProjectLocationsResponse);
  
  // Script element management (for line-by-line editing of the screenplay content)
  rpc CreateScriptElement(CreateScriptElementRequest) returns (CreateScriptElementResponse);
  rpc GetProjectScriptElements(GetProjectScriptElementsRequest) returns (GetProjectScriptElementsResponse);
  rpc UpdateScriptElement(UpdateScriptElementRequest) returns (UpdateScriptElementResponse);
  rpc DeleteScriptElement(DeleteScriptElementRequest) returns (DeleteScriptElementResponse);
  rpc BulkUpdateScriptElements(BulkUpdateScriptElementsRequest) returns (BulkUpdateScriptElementsResponse);
  rpc BatchCreateElements(BatchCreateElementsRequest) returns (BatchCreateElementsResponse);
  
  // Simplified element operations for gateway
  rpc CreateElement(CreateElementRequest) returns (CreateElementResponse);
  rpc UpdateElement(UpdateElementRequest) returns (UpdateElementResponse);
  rpc GetSceneElements(GetSceneElementsRequest) returns (GetSceneElementsResponse);
  
  // Beat Board management
  rpc CreateBeat(CreateBeatRequest) returns (CreateBeatResponse);
  rpc GetBeat(GetBeatRequest) returns (GetBeatResponse);
  rpc GetProjectBeatBoard(GetProjectBeatBoardRequest) returns (GetProjectBeatBoardResponse);
  rpc UpdateBeat(UpdateBeatRequest) returns (UpdateBeatResponse);
  rpc DeleteBeat(DeleteBeatRequest) returns (DeleteBeatResponse);
  
  rpc CreateConnection(CreateConnectionRequest) returns (CreateConnectionResponse);
  rpc DeleteConnection(DeleteConnectionRequest) returns (DeleteConnectionResponse);
  
  rpc CreateLane(CreateLaneRequest) returns (CreateLaneResponse);
  rpc GetProjectLanes(GetProjectLanesRequest) returns (GetProjectLanesResponse);
  rpc UpdateLane(UpdateLaneRequest) returns (UpdateLaneResponse);
  rpc UpdateLaneOrder(UpdateLaneOrderRequest) returns (UpdateLaneOrderResponse);
  rpc DeleteLane(DeleteLaneRequest) returns (DeleteLaneResponse);
  
  rpc CreateOutlineItem(CreateOutlineItemRequest) returns (CreateOutlineItemResponse);
  rpc UpdateOutlineItem(UpdateOutlineItemRequest) returns (UpdateOutlineItemResponse);
  rpc DeleteOutlineItem(DeleteOutlineItemRequest) returns (DeleteOutlineItemResponse);
}