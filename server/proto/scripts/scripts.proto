syntax = "proto3";

package scripts;

option go_package = "inkwell/server/pkg/grpc/scripts";

import "common/types.proto";

// Project entity
message Project {
  string id = 1;
  string title = 2;
  string description = 3;
  string owner_id = 4;
  common.Timestamp created_at = 5;
  common.Timestamp updated_at = 6;
  string status = 7; // "draft", "active", "completed", "archived"
  bool is_starred = 8;
  string category = 9; // "screenplay", "novel", "comic_script", "poetry", "interactive_fiction", "tabletop_rpg", "memoir", "lyrics"
  common.Timestamp deleted_at = 10; // tombstone for sync (nil = live)
  string org_id = 11; // owning organization (empty = personal project owned by owner_id)
}

// Note: Screenplay is now represented by Project entity
// The Project contains the script content through ProjectElements

// Scene entity
message Scene {
  string id = 1;
  string project_id = 2;
  string outline_unit_id = 3; // Optional link to outline unit
  string scene_heading = 4; // INT./EXT. LOCATION - TIME
  string content = 5; // Scene content/action
  int32 order_index = 6;
  common.Timestamp created_at = 7;
  common.Timestamp updated_at = 8;
  common.Timestamp deleted_at = 9; // tombstone for sync (nil = live)
}

// ProjectElement is a single content element (paragraph, line, panel, stat block, passage body, etc.) within a scene/container — interpreted per format.
message ProjectElement {
  string id = 1;
  string project_id = 2; // Changed from screenplay_id to project_id
  string scene_id = 3; // Required link to scene - elements must belong to a scene
  string type = 4; // format-specific element type, interpreted per editor
  string content = 5; // The actual text content
  reserved 6; // was character_id (screenplay-only, never populated) — removed
  reserved "character_id";
  int32 line_number = 7; // ordering index within the scene/container
  map<string, string> formatting = 8; // Additional formatting attributes
  common.Timestamp created_at = 9;
  common.Timestamp updated_at = 10;
  common.Timestamp deleted_at = 11; // tombstone for sync (nil = live)
}

// Unified outline unit entity (acts, sequences, beats, sub-beats)
message OutlineUnit {
  string id = 1;
  string project_id = 2;
  string parent_id = 3; // For hierarchical structure
  string type = 4; // "act", "sequence", "beat", "sub-beat"
  string title = 5;
  string description = 6;
  string color = 7; // For color coding in editor
  repeated string tags = 8; // Array of tags
  string icon = 9; // Icon name for display
  string scene_id = 10; // Optional link to scene
  int32 order_index = 11;
  common.Timestamp created_at = 12;
  common.Timestamp updated_at = 13;
}

// Character entity
message Character {
  string id = 1;
  string project_id = 2;
  string name = 3;
  string description = 4;
  string role = 5; // "protagonist", "antagonist", "supporting", etc.
  map<string, string> attributes = 6; // Key-value pairs for character traits
  common.Timestamp created_at = 7;
  common.Timestamp updated_at = 8;
  common.Timestamp deleted_at = 9; // tombstone for sync (nil = live)
}

// Location entity
message Location {
  string id = 1;
  string project_id = 2;
  string name = 3;
  string description = 4;
  string type = 5; // "interior", "exterior"
  common.Timestamp created_at = 6;
  common.Timestamp updated_at = 7;
  common.Timestamp deleted_at = 8; // tombstone for sync (nil = live)
}

// Beat Board entities
message Beat {
  string id = 1;
  string project_id = 2;
  string title = 3;
  string description = 4;
  string scene_numbers = 5; // DEPRECATED: Use start_page and end_page
  string color = 6;
  double position_x = 7;
  double position_y = 8;
  double width = 9;
  double height = 10;
  int32 act_number = 11;
  int32 order = 12;
  common.Timestamp created_at = 13;
  common.Timestamp updated_at = 14;
  int32 start_page = 15;
  int32 end_page = 16;
  optional string image_url = 17;
  common.Timestamp deleted_at = 18; // tombstone for sync (nil = live)
}

message Connection {
  string id = 1;
  string project_id = 2;
  string from_beat_id = 3;
  string to_beat_id = 4;
  string from_side = 5; // "top", "right", "bottom", "left"
  string to_side = 6;
  common.Timestamp created_at = 7;
  common.Timestamp updated_at = 8; // added for sync delta ordering
  common.Timestamp deleted_at = 9; // tombstone for sync (nil = live)
}

message Lane {
  string id = 1;
  string project_id = 2;
  string name = 3;
  string color = 4;
  int32 order = 5;
  common.Timestamp created_at = 6;
  common.Timestamp updated_at = 7;
  common.Timestamp deleted_at = 8; // tombstone for sync (nil = live)
}

message OutlineItem {
  string id = 1;
  string project_id = 2;
  string beat_id = 3;
  string lane_id = 4;
  int32 order = 5;
  double timeline_position = 6;
  double width = 7;
  common.Timestamp created_at = 8;
  common.Timestamp updated_at = 9;
  common.Timestamp deleted_at = 10; // tombstone for sync (nil = live)
}

// One shape on the beat-board drawing layer. Per-shape rather than one blob per
// board, so a shape is what sync pushes and conflicts on — see
// decisions/0022-drawing-per-shape-rows.md.
message Drawing {
  string id = 1;
  string project_id = 2;
  // pen | line | arrow | rect | ellipse. Deliberately a string: a new shape kind
  // shouldn't cost a proto change and two migrations.
  string kind = 3;
  // Opaque JSON: geometry (points) + style. The server stores and returns it and
  // never looks inside, so it stays a string end to end.
  string data = 4;
  int32 order = 5; // z-order within the layer
  common.Timestamp created_at = 6;
  common.Timestamp updated_at = 7;
  common.Timestamp deleted_at = 8; // tombstone for sync (nil = live)
}

message BeatBoardData {
  repeated Beat beats = 1;
  repeated Connection connections = 2;
  repeated Lane lanes = 3;
  repeated OutlineItem outline_items = 4;
  repeated Drawing drawings = 5;
}

// Project requests/responses
message CreateProjectRequest {
  string title = 1;
  string description = 2;
  string owner_id = 3;
  string category = 4;
  string org_id = 5; // optional; when set the project is owned by this organization
}

message CreateProjectResponse {
  Project project = 1;
}

// user_id is always the real authenticated actor (never empty — Orbit #360
// removed the old empty-user_id "give me the project unauthenticated" path;
// see GetProjectAccessMetadata for the legitimate no-actor lookup that replaced
// it). caller_role is the gateway's resolved access level for that actor.
message GetProjectRequest {
  string project_id = 1;
  string user_id = 2; // For authorization check
  // Set exclusively by the gateway (the trusted internal caller) after
  // resolving access via handlers.ResolveProjectRole — never derived from
  // client input. Orbit #360: replaces the empty-user_id bypass sentinel.
  CallerRole caller_role = 3;
}

message GetProjectResponse {
  Project project = 1;
}

message UpdateProjectRequest {
  string project_id = 1;
  string user_id = 2; // For authorization check
  optional string title = 3;
  optional string description = 4;
  optional string status = 5;
}

message UpdateProjectResponse {
