[package]
name = "inkwell"
version = "0.6.0"
description = "Inkwell — a local-first writing platform"
authors = ["Inkwell"]
license = "PolyForm-Shield-1.0.0"
repository = "https://github.com/garaku-yard/inkwell"
edition = "2021"
rust-version = "1.77.2"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
name = "app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.5.6", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
tauri = { version = "2.11", features = ["protocol-asset"] }
tauri-plugin-log = "2"
tauri-plugin-sql = { version = "2", features = ["sqlite"] }
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
tauri-plugin-opener = "2"
keyring = { version = "3", default-features = false, features = ["apple-native", "windows-native", "sync-secret-service", "crypto-rust"] }
# MCP bridge (ADR 0025): a loopback HTTP endpoint the external agent talks to.
# tiny_http is blocking and self-contained, so the bridge runs on its own
# thread without entangling itself with Tauri's async runtime.
tiny_http = "0.12"
uuid = { version = "1", features = ["v4"] }
base64 = "0.23"
sha2 = "0.11"
url = "2.5"
reqwest = { version = "0.13", default-features = false, features = ["blocking", "form", "json", "rustls"] }
