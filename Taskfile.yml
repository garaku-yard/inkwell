version: "3"

# Global variables
vars:
  DOCKER_COMPOSE: docker compose
  GO_CMD: go
  NPM_CMD: npm

# Tasks
tasks:
  # ====================
  # Setup & Installation
  # ====================
  install:
    desc: Install all dependencies (Go modules + Node modules)
    cmds:
      - task: install:server
      - task: install:client

  install:server:
    desc: Install Go dependencies for all microservices
    dir: server
    cmds:
      - go mod download
      - go mod tidy

  install:client:
    desc: Install Node.js dependencies for client
    dir: client
    cmds:
      - npm install

  # ====================
  # Development
  # ====================
  dev:
    desc: Start backends in Docker + Next.js locally with hot reload (recommended)
    preconditions:
      - test -f .env || (echo "❌ ERROR - .env file not found! Run 'task setup' first" && exit 1)
    cmds:
      - "{{.DOCKER_COMPOSE}} up -d --scale client=0"
      - 'echo "✅ Backend services started! Launching Next.js dev server at http://localhost:3000..."'
      - task: dev:client

  dev:full:
    desc: Start all services in Docker including client (production build, no hot reload)
    preconditions:
      - test -f .env || (echo "❌ ERROR - .env file not found! Run 'task setup' first" && exit 1)
    cmds:
      - task: docker:up
      - 'echo "Services started! Frontend: http://localhost:3000, API: http://localhost:8080"'

  dev:client:
    desc: Run Next.js client locally with hot reload
    dir: client
    cmds:
      - npm install
      - npm run dev

  # ====================
  # Docker Operations
  # ====================
  docker:up:
    desc: Start all Docker containers
    cmds:
      - "{{.DOCKER_COMPOSE}} up -d"
      - task: docker:logs

  docker:down:
    desc: Stop all Docker containers
    cmds:
      - "{{.DOCKER_COMPOSE}} down"

  docker:restart:
    desc: Restart all Docker containers
    cmds:
      - "{{.DOCKER_COMPOSE}} restart"

  docker:build:
    desc: Build all Docker images (no start)
    cmds:
      - "{{.DOCKER_COMPOSE}} build"

  docker:build:gateway:
    desc: Build API Gateway image only (no start)
    cmds:
      - "{{.DOCKER_COMPOSE}} build api-gateway"

  docker:build:identity:
    desc: Build Identity Service image only (no start)
    cmds:
      - "{{.DOCKER_COMPOSE}} build identity-service"

  docker:build:scripts:
    desc: Build Scripts Service image only (no start)
    cmds:
      - "{{.DOCKER_COMPOSE}} build scripts-service"

  docker:build:collab:
    desc: Build Collab Service image only (no start)
    cmds:
      - "{{.DOCKER_COMPOSE}} build collab-service"

  docker:build:billing:
    desc: Build Billing Service image only (no start)
    cmds:
      - "{{.DOCKER_COMPOSE}} build billing-service"

  docker:build:workspace:
    desc: Build Workspace Service image only (no start)
    cmds:
      - "{{.DOCKER_COMPOSE}} build workspace-service"

  docker:build:notifications:
    desc: Build Notifications Service image only (no start)
    cmds:
      - "{{.DOCKER_COMPOSE}} build notifications-service"

  docker:build:client:
    desc: Build Client image only (no start)
    cmds:
      - "{{.DOCKER_COMPOSE}} build client"

  docker:rebuild:
    desc: Rebuild and restart all containers
    cmds:
      - task: docker:down
      - task: docker:build
      - task: docker:up

  docker:rebuild:gateway:
    desc: Rebuild and restart API Gateway (use `task docker:logs:gateway` to tail)
    cmds:
      - "{{.DOCKER_COMPOSE}} build api-gateway"
      - "{{.DOCKER_COMPOSE}} up -d api-gateway"

  docker:rebuild:identity:
    desc: Rebuild and restart Identity Service (use `task docker:logs:identity` to tail)
    cmds:
      - "{{.DOCKER_COMPOSE}} build identity-service"
      - "{{.DOCKER_COMPOSE}} up -d identity-service"

  docker:rebuild:scripts:
    desc: Rebuild and restart Scripts Service (use `task docker:logs:scripts` to tail)
    cmds:
      - "{{.DOCKER_COMPOSE}} build scripts-service"
      - "{{.DOCKER_COMPOSE}} up -d scripts-service"

  docker:rebuild:collab:
    desc: Rebuild and restart Collab Service (use `task docker:logs:collab` to tail)
    cmds:
      - "{{.DOCKER_COMPOSE}} build collab-service"
      - "{{.DOCKER_COMPOSE}} up -d collab-service"

  docker:rebuild:billing:
    desc: Rebuild and restart Billing Service (use `task docker:logs:billing` to tail)
    cmds:
      - "{{.DOCKER_COMPOSE}} build billing-service"
      - "{{.DOCKER_COMPOSE}} up -d billing-service"

  docker:rebuild:workspace:
    desc: Rebuild and restart Workspace Service (use `task docker:logs:workspace` to tail)
    cmds:
      - "{{.DOCKER_COMPOSE}} build workspace-service"
      - "{{.DOCKER_COMPOSE}} up -d workspace-service"

  docker:rebuild:notifications:
    desc: Rebuild and restart Notifications Service (use `task docker:logs:notifications` to tail)
    cmds:
      - "{{.DOCKER_COMPOSE}} build notifications-service"
      - "{{.DOCKER_COMPOSE}} up -d notifications-service"

  docker:rebuild:client:
    desc: Rebuild and restart Client (use `task docker:logs:client` to tail)
    cmds:
      - "{{.DOCKER_COMPOSE}} build client"
      - "{{.DOCKER_COMPOSE}} up -d client"

  docker:logs:gateway:
    desc: Tail logs for API Gateway
    cmds:
      - "{{.DOCKER_COMPOSE}} logs -f api-gateway"

  docker:logs:identity:
    desc: Tail logs for Identity Service
    cmds:
      - "{{.DOCKER_COMPOSE}} logs -f identity-service"

  docker:logs:scripts:
    desc: Tail logs for Scripts Service
    cmds:
      - "{{.DOCKER_COMPOSE}} logs -f scripts-service"

  docker:logs:collab:
    desc: Tail logs for Collab Service
    cmds:
      - "{{.DOCKER_COMPOSE}} logs -f collab-service"

  docker:logs:billing:
    desc: Tail logs for Billing Service
    cmds:
      - "{{.DOCKER_COMPOSE}} logs -f billing-service"

  docker:logs:workspace:
    desc: Tail logs for Workspace Service
    cmds:
      - "{{.DOCKER_COMPOSE}} logs -f workspace-service"

  docker:logs:notifications:
    desc: Tail logs for Notifications Service
    cmds:
      - "{{.DOCKER_COMPOSE}} logs -f notifications-service"

  docker:logs:client:
    desc: Tail logs for Client
    cmds:
      - "{{.DOCKER_COMPOSE}} logs -f client"

  docker:logs:
    desc: Show logs from all containers
    cmds:
      - "{{.DOCKER_COMPOSE}} logs -f"

  docker:ps:
    desc: Show status of all containers
    cmds:
      - "{{.DOCKER_COMPOSE}} ps"

  docker:prune:
    desc: Reclaim disk from dangling images left behind by rebuilds (safe - keeps volumes/data)
    # Every `docker compose build` orphans the previous image as an untagged
    # layer and nothing collects them. A day of rebuilding left 39 of them =
    # 13.2GB, which is how this repo fills a disk. `image prune` (no -a) only
    # touches dangling images: tagged images and, crucially, VOLUMES — which hold
    # the dev databases — are untouched. Never add --volumes here.
    cmds:
      - docker image prune -f
      - 'echo "💡 Also worth a look when space is tight: client/.next, client/src-tauri/target/debug/incremental, npm cache clean --force"'

  docker:clean:
    desc: Stop containers and remove volumes (WARNING deletes all data!)
    cmds:
      - "{{.DOCKER_COMPOSE}} down -v --remove-orphans"

  # ====================
  # Database Operations
  # ====================
  db:up:
    desc: Start only database containers
    cmds:
      - "{{.DOCKER_COMPOSE}} up -d postgres-identity postgres-scripts postgres-collab postgres-billing postgres-workspace postgres-notifications redis"

  db:down:
    desc: Stop database containers
    cmds:
      - "{{.DOCKER_COMPOSE}} stop postgres-identity postgres-scripts postgres-collab postgres-billing postgres-workspace postgres-notifications redis"

  db:migrate:
    desc: Run migrations for all services (applied automatically on service startup)
    cmds:
      - 'echo "Migrations run automatically when each service starts (golang-migrate via pkg/database.RunMigrations)"'
      - 'echo "To re-apply, restart the services:"'
      - task: docker:restart

  db:shell:scripts:
    desc: Open PostgreSQL shell for scripts database
    cmds:
      - "{{.DOCKER_COMPOSE}} exec postgres-scripts psql -U postgres -d scripts_db"

  db:shell:identity:
    desc: Open PostgreSQL shell for identity database
    cmds:
      - "{{.DOCKER_COMPOSE}} exec postgres-identity psql -U postgres -d identity_db"

  db:shell:collab:
    desc: Open PostgreSQL shell for collab database
    cmds:
      - "{{.DOCKER_COMPOSE}} exec postgres-collab psql -U postgres -d collab_db"

  db:shell:billing:
    desc: Open PostgreSQL shell for billing database
    cmds:
      - "{{.DOCKER_COMPOSE}} exec postgres-billing psql -U postgres -d billing_db"

  db:status:
    desc: Check database tables (verify migrations)
    cmds:
      - 'echo "=== Scripts Database Tables ==="'
      - "{{.DOCKER_COMPOSE}} exec postgres-scripts psql -U postgres -d scripts_db -c '\\dt'"
      - 'echo "\n=== Identity Database Tables ==="'
      - "{{.DOCKER_COMPOSE}} exec postgres-identity psql -U postgres -d identity_db -c '\\dt'"
      - 'echo "\n=== Collab Database Tables ==="'
      - "{{.DOCKER_COMPOSE}} exec postgres-collab psql -U postgres -d collab_db -c '\\dt'"
      - 'echo "\n=== Billing Database Tables ==="'
      - "{{.DOCKER_COMPOSE}} exec postgres-billing psql -U postgres -d billing_db -c '\\dt'"

  # ====================
  # Build Operations
  # ====================
  build:all:
    desc: Build all services (Go + Node.js)
    cmds:
      - task: build:server
      - task: build:client

  build:server:
    desc: Build all Go microservices
    dir: server
    cmds:
      - task: build:server:gateway
      - task: build:server:identity
      - task: build:server:scripts
      - task: build:server:collab
      - task: build:server:billing

  build:server:gateway:
    desc: Build API Gateway
    dir: server
    cmds:
      - go build -o bin/gateway ./cmd/gateway

  build:server:identity:
    desc: Build Identity Service
    dir: server
    cmds:
      - go build -o bin/identity ./cmd/identity

  build:server:scripts:
    desc: Build Scripts Service
    dir: server
    cmds:
      - go build -o bin/scripts ./cmd/scripts

  build:server:collab:
    desc: Build Collab Service
    dir: server
    cmds:
      - go build -o bin/collab ./cmd/collab

  build:server:billing:
    desc: Build Billing Service
    dir: server
    cmds:
      - go build -o bin/billing ./cmd/billing

  build:client:
    desc: Build Next.js client
    dir: client
    cmds:
      - npm run build

  # ====================
  # Testing
  # ====================
  test:
    desc: Run all tests
    cmds:
      - task: test:server
      - task: test:client

  test:server:
    desc: Run Go tests for all microservices
    dir: server
    cmds:
      - go test ./...

  test:boundary:
    desc: Run cross-service boundary integration tests
    dir: server
    cmds:
      - go test -race -count=1 -tags=boundaryintegration ./integration/...

  test:boundary:db:
    desc: Run PostgreSQL ownership boundary tests (requires COLLAB_TEST_DATABASE_URL)
    dir: server
    requires:
      vars: [COLLAB_TEST_DATABASE_URL]
    cmds:
      - go test -race -count=1 -tags=dbintegration ./integration/ownership

  test:client:
    desc: Run client tests
    dir: client
    cmds:
      - npm test

  categories:sync:
    desc: Copy the authoritative category list to the server (client/lib/categories.json is the source)
    cmds:
      - cp client/lib/categories.json server/internal/workspace/categories.json
      - 'echo "✅ Synced. The workspace-service embeds this at build time; restart it to reseed."'

  # ====================
  # Code Quality
  # ====================
  lint:
    desc: Run linters for all code
    cmds:
      - task: lint:server
      - task: lint:client

  lint:server:
    desc: Run Go linters
    dir: server
    cmds:
      - go vet ./...
      - go fmt ./...

  lint:client:
    desc: Run ESLint for client
    dir: client
    cmds:
      - npm run lint

  format:
    desc: Format all code
    cmds:
      - task: format:server
      - task: format:client

  format:server:
    desc: Format Go code
    dir: server
    cmds:
      - go fmt ./...

  format:client:
    desc: Format client code
    dir: client
    cmds:
      - npm run lint:fix || npm run format || echo "No format script found"

  # ====================
  # Protobuf Generation
  # ====================
  proto:gen:
    desc: Generate protobuf code for all services
    dir: server
    cmds:
      - 'echo "Generating protobuf files..."'
      - task: proto:gen:common
      - task: proto:gen:identity
      - task: proto:gen:scripts
      - task: proto:gen:collab
      - task: proto:gen:billing
      - task: proto:gen:workspace
      - task: proto:gen:aisettings
      - task: proto:gen:notifications

  proto:gen:common:
    desc: Generate protobuf code for Common types
    dir: server
    cmds:
      - protoc --proto_path=proto --go_out=pkg/grpc --go_opt=paths=source_relative --go-grpc_out=pkg/grpc --go-grpc_opt=paths=source_relative common/types.proto

  proto:gen:scripts:
    desc: Generate protobuf code for Scripts service
    dir: server
    cmds:
      - protoc --proto_path=proto --go_out=pkg/grpc --go_opt=paths=source_relative --go-grpc_out=pkg/grpc --go-grpc_opt=paths=source_relative scripts/scripts.proto

  proto:gen:identity:
    desc: Generate protobuf code for Identity service
    dir: server
    cmds:
      - protoc --proto_path=proto --go_out=pkg/grpc --go_opt=paths=source_relative --go-grpc_out=pkg/grpc --go-grpc_opt=paths=source_relative identity/identity.proto

  proto:gen:collab:
    desc: Generate protobuf code for Collab service
    dir: server
    cmds:
      - protoc --proto_path=proto --go_out=pkg/grpc --go_opt=paths=source_relative --go-grpc_out=pkg/grpc --go-grpc_opt=paths=source_relative collab/collab.proto

  proto:gen:billing:
    desc: Generate protobuf code for Billing service
    dir: server
    cmds:
      - protoc --proto_path=proto --go_out=pkg/grpc --go_opt=paths=source_relative --go-grpc_out=pkg/grpc --go-grpc_opt=paths=source_relative billing/billing.proto

  proto:gen:workspace:
    desc: Generate protobuf code for Workspace service
    dir: server
    cmds:
      - protoc --proto_path=proto --go_out=pkg/grpc --go_opt=paths=source_relative --go-grpc_out=pkg/grpc --go-grpc_opt=paths=source_relative workspace/workspace.proto

  proto:gen:aisettings:
    desc: Generate protobuf code for AI Settings service
    dir: server
    cmds:
      - protoc --proto_path=proto --go_out=pkg/grpc --go_opt=paths=source_relative --go-grpc_out=pkg/grpc --go-grpc_opt=paths=source_relative aisettings/aisettings.proto

  proto:gen:notifications:
    desc: Generate protobuf code for Notifications service
    dir: server
    cmds:
      - protoc --proto_path=proto --go_out=pkg/grpc --go_opt=paths=source_relative --go-grpc_out=pkg/grpc --go-grpc_opt=paths=source_relative notifications/notifications.proto

  # ====================
  # Service-Specific Operations
  # ====================
  service:gateway:
    desc: Restart only API Gateway
    cmds:
      - "{{.DOCKER_COMPOSE}} restart api-gateway"
      - "{{.DOCKER_COMPOSE}} logs -f api-gateway"

  service:scripts:
    desc: Restart only Scripts Service
    cmds:
      - "{{.DOCKER_COMPOSE}} restart scripts-service"
      - "{{.DOCKER_COMPOSE}} logs -f scripts-service"

  service:identity:
    desc: Restart only Identity Service
    cmds:
      - "{{.DOCKER_COMPOSE}} restart identity-service"
      - "{{.DOCKER_COMPOSE}} logs -f identity-service"

  service:client:
    desc: Restart only Client
    cmds:
      - "{{.DOCKER_COMPOSE}} restart client"
      - "{{.DOCKER_COMPOSE}} logs -f client"

  # ====================
  # Database Migrations & SQLC
  # ====================
  tools:install:
    desc: Install development tools (golang-migrate)
    dir: server
    cmds:
      - go install -tags 'postgres' github.com/golang-migrate/migrate/v4/cmd/migrate@latest
      - 'echo "✅ Tools installed successfully!"'

  migrate:up:
    desc: Run all pending migrations for all services
    cmds:
      - task: migrate:up:identity
      - task: migrate:up:scripts
      - task: migrate:up:collab
      - task: migrate:up:billing

  migrate:down:
    desc: Rollback last migration for all services
    cmds:
      - task: migrate:down:identity
      - task: migrate:down:scripts
      - task: migrate:down:collab
      - task: migrate:down:billing

  migrate:up:identity:
    desc: Run migrations for Identity service
    dir: server
    cmds:
      - migrate -path internal/identity/migrations -database "postgresql://${IDENTITY_DB_USER:-postgres}:${IDENTITY_DB_PASSWORD:-postgres}@${IDENTITY_DB_HOST:-localhost}:${IDENTITY_DB_PORT:-5432}/${IDENTITY_DB_NAME:-identity_db}?sslmode=disable" up
      - 'echo "✅ Identity migrations applied!"'

  migrate:down:identity:
    desc: Rollback last migration for Identity service
    dir: server
    cmds:
      - migrate -path internal/identity/migrations -database "postgresql://${IDENTITY_DB_USER:-postgres}:${IDENTITY_DB_PASSWORD:-postgres}@${IDENTITY_DB_HOST:-localhost}:${IDENTITY_DB_PORT:-5432}/${IDENTITY_DB_NAME:-identity_db}?sslmode=disable" down 1

  migrate:up:scripts:
    desc: Run migrations for Scripts service
    dir: server
    cmds:
      - migrate -path internal/scripts/migrations -database "postgresql://${SCRIPTS_DB_USER:-postgres}:${SCRIPTS_DB_PASSWORD:-postgres}@${SCRIPTS_DB_HOST:-localhost}:${SCRIPTS_DB_PORT:-5433}/${SCRIPTS_DB_NAME:-scripts_db}?sslmode=disable" up
      - 'echo "✅ Scripts migrations applied!"'

  migrate:down:scripts:
    desc: Rollback last migration for Scripts service
    dir: server
    cmds:
      - migrate -path internal/scripts/migrations -database "postgresql://${SCRIPTS_DB_USER:-postgres}:${SCRIPTS_DB_PASSWORD:-postgres}@${SCRIPTS_DB_HOST:-localhost}:${SCRIPTS_DB_PORT:-5433}/${SCRIPTS_DB_NAME:-scripts_db}?sslmode=disable" down 1

  migrate:up:collab:
    desc: Run migrations for Collaboration service
    dir: server
    cmds:
      - migrate -path internal/collab/migrations -database "postgresql://${COLLAB_DB_USER:-postgres}:${COLLAB_DB_PASSWORD:-postgres}@${COLLAB_DB_HOST:-localhost}:${COLLAB_DB_PORT:-5434}/${COLLAB_DB_NAME:-collab_db}?sslmode=disable" up
      - 'echo "✅ Collaboration migrations applied!"'

  migrate:down:collab:
    desc: Rollback last migration for Collaboration service
    dir: server
    cmds:
      - migrate -path internal/collab/migrations -database "postgresql://${COLLAB_DB_USER:-postgres}:${COLLAB_DB_PASSWORD:-postgres}@${COLLAB_DB_HOST:-localhost}:${COLLAB_DB_PORT:-5434}/${COLLAB_DB_NAME:-collab_db}?sslmode=disable" down 1

  migrate:up:billing:
    desc: Run migrations for Billing service
    dir: server
    cmds:
      - migrate -path internal/billing/migrations -database "postgresql://${BILLING_DB_USER:-postgres}:${BILLING_DB_PASSWORD:-postgres}@${BILLING_DB_HOST:-localhost}:${BILLING_DB_PORT:-5435}/${BILLING_DB_NAME:-billing_db}?sslmode=disable" up
      - 'echo "✅ Billing migrations applied!"'

  migrate:down:billing:
    desc: Rollback last migration for Billing service
    dir: server
    cmds:
      - migrate -path internal/billing/migrations -database "postgresql://${BILLING_DB_USER:-postgres}:${BILLING_DB_PASSWORD:-postgres}@${BILLING_DB_HOST:-localhost}:${BILLING_DB_PORT:-5435}/${BILLING_DB_NAME:-billing_db}?sslmode=disable" down 1

  migrate:create:
    desc: Create a new migration file (usage - task migrate:create SERVICE=identity NAME=add_users_table)
    dir: server
    cmds:
      - migrate create -ext sql -dir internal/{{.SERVICE}}/migrations -seq {{.NAME}}
      - 'echo "✅ Migration files created in internal/{{.SERVICE}}/migrations/"'

  # ====================
  # Utilities
  # ====================
  clean:
    desc: Clean build artifacts and caches
    cmds:
      - rm -rf server/bin
      - rm -rf client/.next
      - rm -rf client/node_modules
      - rm -rf server/vendor

  setup:
    desc: Initial setup for new developers
    cmds:
      - 'echo "🚀 Setting up Inkwell development environment..."'
      - task: install
      - 'echo "✅ Dependencies installed!"'
      - task: tools:install
      - 'echo "⚠️  Next steps:"'
      - 'echo "1. Create .env file: cp .env.example .env"'
      - 'echo "2. Edit .env with your credentials (POSTGRES_USER, POSTGRES_PASSWORD, etc)"'
      - 'echo "3. Run: task fresh (for first time setup)"'
      - 'echo "4. Run: task dev (to start services after setup)"'

  fresh:
    desc: Fresh start (clean everything and rebuild from scratch)
    preconditions:
      - test -f .env || (echo "❌ ERROR - .env file not found! Create it first - cp .env.example .env and edit the credentials" && exit 1)
    cmds:
      - 'echo "🧹 Cleaning everything..."'
      - task: docker:clean
      - task: clean
      - 'echo "📦 Installing dependencies..."'
      - task: install
      - 'echo "🔨 Building Docker images..."'
      - task: docker:build
      - 'echo "🚀 Starting all services..."'
      - task: docker:up
      - 'echo "⏳ Waiting for databases to be ready..."'
      - sleep 5
      - 'echo "🗄️  Running database migrations..."'
      - task: migrate:up
      - 'echo "✅ All services started! Frontend at http://localhost:3000, API at http://localhost:8080"'

  help:
    desc: Show all available tasks
    cmds:
      - task --list
