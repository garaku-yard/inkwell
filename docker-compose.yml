services:
  # ===== Databases =====
  postgres-identity:
    image: postgres:15-alpine
    container_name: inkwell-identity-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: identity_db
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
    ports:
      - "5432:5432"
    volumes:
      - postgres_identity_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - inkwell-network

  postgres-scripts:
    image: postgres:15-alpine
    container_name: inkwell-scripts-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: scripts_db
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
    ports:
      - "5433:5432"
    volumes:
      - postgres_scripts_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - inkwell-network

  postgres-collab:
    image: postgres:15-alpine
    container_name: inkwell-collab-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: collab_db
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
    ports:
      - "5434:5432"
    volumes:
      - postgres_collab_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - inkwell-network

  postgres-billing:
    image: postgres:15-alpine
    container_name: inkwell-billing-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: billing_db
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
    ports:
      - "5435:5432"
    volumes:
      - postgres_billing_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - inkwell-network

  # ===== Redis Cache =====
  redis:
    image: redis:7-alpine
    container_name: inkwell-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes --requirepass ${REDIS_PASSWORD:-redis}
    healthcheck:
      test: ["CMD", "redis-cli", "--raw", "incr", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
    networks:
      - inkwell-network

  # ===== Message Queue =====
  zookeeper:
    image: confluentinc/cp-zookeeper:7.4.0
    container_name: inkwell-zookeeper
    restart: unless-stopped
    environment:
      ZOOKEEPER_CLIENT_PORT: ${ZOOKEEPER_CLIENT_PORT:-2181}
      ZOOKEEPER_TICK_TIME: ${ZOOKEEPER_TICK_TIME:-2000}
    ports:
      - "${ZOOKEEPER_CLIENT_PORT:-2181}:2181"
    volumes:
      - zookeeper_data:/var/lib/zookeeper/data
      - zookeeper_logs:/var/lib/zookeeper/log
    healthcheck:
      test: ["CMD-SHELL", "nc -z localhost 2181 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - inkwell-network

  kafka:
    image: confluentinc/cp-kafka:7.4.0
    container_name: inkwell-kafka
    restart: unless-stopped
    depends_on:
      zookeeper:
        condition: service_healthy
    ports:
      - "${KAFKA_PORT:-9092}:9092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:${ZOOKEEPER_CLIENT_PORT:-2181}
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:${KAFKA_PORT:-9092}
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:29092,PLAINTEXT_HOST://0.0.0.0:9092
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
    volumes:
      - kafka_data:/var/lib/kafka/data
    healthcheck:
      test: ["CMD", "kafka-topics", "--bootstrap-server", "localhost:9092", "--list"]
      interval: 10s
      timeout: 10s
      retries: 10
      start_period: 30s
    networks:
      - inkwell-network

  # ===== Microservices =====
  identity-service:
    build:
      context: ./server
      dockerfile: cmd/identity/Dockerfile
    container_name: inkwell-identity-service
    restart: unless-stopped
    ports:
      - "50051:50051"
    environment:
      - GRPC_PORT=50051
      - IDENTITY_DB_HOST=postgres-identity
      - IDENTITY_DB_PORT=5432
      - IDENTITY_DB_USER=${POSTGRES_USER:-postgres}
      - IDENTITY_DB_PASSWORD=${POSTGRES_PASSWORD:-postgres}
      - IDENTITY_DB_NAME=identity_db
      - IDENTITY_DB_SSLMODE=disable
      - ENVIRONMENT=${ENVIRONMENT:-development}
      - JWT_SECRET=${JWT_SECRET:?JWT_SECRET must be set — copy .env.example to .env and edit it}
      - KAFKA_BROKERS=kafka:29092
      - RUN_MIGRATIONS=true
    depends_on:
      postgres-identity:
        condition: service_healthy
      kafka:
        condition: service_healthy
    networks:
      - inkwell-network

  scripts-service:
    build:
      context: ./server
      dockerfile: cmd/scripts/Dockerfile
    container_name: inkwell-scripts-service
    restart: unless-stopped
    ports:
      - "50052:50052"
    environment:
      - GRPC_PORT=50052
      - SCRIPTS_DB_HOST=postgres-scripts
      - SCRIPTS_DB_PORT=5432
      - SCRIPTS_DB_USER=${POSTGRES_USER:-postgres}
      - SCRIPTS_DB_PASSWORD=${POSTGRES_PASSWORD:-postgres}
      - SCRIPTS_DB_NAME=scripts_db
      - SCRIPTS_DB_SSLMODE=disable
      - KAFKA_BROKERS=kafka:29092
      - IDENTITY_SERVICE_URL=identity-service:50051
      - BILLING_SERVICE_HOST=billing-service
      - BILLING_SERVICE_PORT=50054
      - RUN_MIGRATIONS=true
    depends_on:
      postgres-scripts:
        condition: service_healthy
      kafka:
        condition: service_healthy
      identity-service:
        condition: service_started
      billing-service:
        condition: service_started
    networks:
      - inkwell-network

  collab-service:
    build:
      context: ./server
      dockerfile: cmd/collab/Dockerfile
    container_name: inkwell-collab-service
    restart: unless-stopped
    ports:
      - "50053:50053"
    environment:
      - GRPC_PORT=50053
      - COLLAB_DB_HOST=postgres-collab
      - COLLAB_DB_PORT=5432
      - COLLAB_DB_USER=${POSTGRES_USER:-postgres}
      - COLLAB_DB_PASSWORD=${POSTGRES_PASSWORD:-postgres}
      - COLLAB_DB_NAME=collab_db
      - COLLAB_DB_SSLMODE=disable
      - KAFKA_BROKERS=kafka:29092
      - IDENTITY_SERVICE_URL=identity-service:50051
      - SCRIPTS_SERVICE_URL=scripts-service:50052
      - RUN_MIGRATIONS=true
    depends_on:
      postgres-collab:
        condition: service_healthy
      kafka:
        condition: service_healthy
      identity-service:
        condition: service_started
      scripts-service:
        condition: service_started
    networks:
      - inkwell-network

  billing-service:
    build:
      context: ./server
      dockerfile: cmd/billing/Dockerfile
    container_name: inkwell-billing-service
    restart: unless-stopped
    ports:
      - "50054:50054"
    environment:
      - GRPC_PORT=50054
      - BILLING_DB_HOST=postgres-billing
      - BILLING_DB_PORT=5432
      - BILLING_DB_USER=${POSTGRES_USER:-postgres}
      - BILLING_DB_PASSWORD=${POSTGRES_PASSWORD:-postgres}
      - BILLING_DB_NAME=billing_db
      - BILLING_DB_SSLMODE=disable
      - KAFKA_BROKERS=kafka:29092
      - IDENTITY_SERVICE_URL=identity-service:50051
      - STRIPE_SECRET_KEY=${STRIPE_SECRET_KEY:-sk_test_xxx}
      - STRIPE_WEBHOOK_SECRET=${STRIPE_WEBHOOK_SECRET:-whsec_xxx}
      - RUN_MIGRATIONS=true
    depends_on:
      postgres-billing:
        condition: service_healthy
      kafka:
        condition: service_healthy
      identity-service:
        condition: service_started
    networks:
      - inkwell-network

  postgres-workspace:
    image: postgres:15-alpine
    container_name: inkwell-workspace-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: workspace_db
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
    ports:
      - "5436:5432"
    volumes:
      - postgres_workspace_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - inkwell-network

  postgres-aisettings:
    image: postgres:15-alpine
    container_name: inkwell-aisettings-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: aisettings_db
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
    ports:
      - "5437:5432"
    volumes:
      - postgres_aisettings_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - inkwell-network

  workspace-service:
    build:
      context: ./server
      dockerfile: cmd/workspace/Dockerfile
    container_name: inkwell-workspace-service
    restart: unless-stopped
    ports:
      - "50056:50056"
    environment:
      - GRPC_PORT=50056
      - WORKSPACE_DB_HOST=postgres-workspace
      - WORKSPACE_DB_PORT=5432
      - WORKSPACE_DB_USER=${POSTGRES_USER:-postgres}
      - WORKSPACE_DB_PASSWORD=${POSTGRES_PASSWORD:-postgres}
      - WORKSPACE_DB_NAME=workspace_db
      - WORKSPACE_DB_SSLMODE=disable
      - RUN_MIGRATIONS=true
    depends_on:
      postgres-workspace:
        condition: service_healthy
    networks:
      - inkwell-network

  aisettings-service:
    build:
      context: ./server
      dockerfile: cmd/aisettings/Dockerfile
    container_name: inkwell-aisettings-service
    restart: unless-stopped
    ports:
      - "50057:50057"
    environment:
      - GRPC_PORT=50057
      - AISETTINGS_DB_HOST=postgres-aisettings
      - AISETTINGS_DB_PORT=5432
      - AISETTINGS_DB_USER=${POSTGRES_USER:-postgres}
      - AISETTINGS_DB_PASSWORD=${POSTGRES_PASSWORD:-postgres}
      - AISETTINGS_DB_NAME=aisettings_db
      - AISETTINGS_DB_SSLMODE=disable
      - AI_ENCRYPTION_KEY=${AI_ENCRYPTION_KEY:?AI_ENCRYPTION_KEY must be set — generate 32 random bytes and base64 them, then set in .env}
      - RUN_MIGRATIONS=true
    depends_on:
      postgres-aisettings:
        condition: service_healthy
    networks:
      - inkwell-network

  api-gateway:
    build:
      context: ./server
      dockerfile: cmd/gateway/Dockerfile
    container_name: inkwell-api-gateway
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      - PORT=8080
      - IDENTITY_SERVICE_HOST=identity-service
      - IDENTITY_SERVICE_PORT=50051
      - SCRIPTS_SERVICE_HOST=scripts-service
      - SCRIPTS_SERVICE_PORT=50052
      - COLLAB_SERVICE_HOST=collab-service
      - COLLAB_SERVICE_PORT=50053
      - BILLING_SERVICE_HOST=billing-service
      - BILLING_SERVICE_PORT=50054
      - WORKSPACE_SERVICE_HOST=workspace-service
      - WORKSPACE_SERVICE_PORT=50056
      - AI_SETTINGS_SERVICE_HOST=aisettings-service
      - AI_SETTINGS_SERVICE_PORT=50057
      - AI_OPENAI_COMPATIBLE_HOSTS=${AI_OPENAI_COMPATIBLE_HOSTS:-}
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - REDIS_PASSWORD=${REDIS_PASSWORD:-redis}
      - ENVIRONMENT=${ENVIRONMENT:-development}
      - ALLOWED_ORIGINS=${ALLOWED_ORIGINS:-http://localhost:3000}
    volumes:
      # Persist user uploads (avatars, etc.) across redeploys. Served back
      # via the gateway's /uploads static handler.
      - gateway_uploads:/app/uploads
    depends_on:
      - redis
      - identity-service
      - scripts-service
      - collab-service
      - billing-service
      - workspace-service
      - aisettings-service
    networks:
      - inkwell-network

  # ===== Frontend =====
  client:
    build:
      context: ./client
      dockerfile: Dockerfile
    container_name: inkwell-client
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - NEXT_PUBLIC_API_URL=http://localhost:8080
      - NODE_ENV=production
    depends_on:
      - api-gateway
    networks:
      - inkwell-network

# ===== Volumes =====
volumes:
  postgres_identity_data:
    driver: local
  postgres_scripts_data:
    driver: local
  postgres_collab_data:
    driver: local
  postgres_billing_data:
    driver: local
  postgres_workspace_data:
    driver: local
  postgres_aisettings_data:
    driver: local
  redis_data:
    driver: local
  zookeeper_data:
    driver: local
  zookeeper_logs:
    driver: local
  gateway_uploads:
    driver: local
  kafka_data:
    driver: local

# ===== Networks =====
networks:
  inkwell-network:
    driver: bridge
